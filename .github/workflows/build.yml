name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Compilar
        run: gradle build

      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: inmersivebackpack-jar
          path: build/libs/inmersivebackpack-1.0.0.jar
